<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Route map with a plotted path and waypoints">
  <rect width="800" height="450" fill="#e8eef4"/>
  <!-- city blocks / terrain -->
  <g fill="#d6e0ea">
    <rect x="50" y="50" width="160" height="110" rx="8"/>
    <rect x="600" y="40" width="150" height="95" rx="8"/>
    <rect x="520" y="310" width="210" height="110" rx="8"/>
    <rect x="70" y="300" width="150" height="115" rx="8"/>
  </g>
  <!-- park -->
  <rect x="320" y="60" width="160" height="120" rx="12" fill="#cbe3c1"/>
  <!-- river -->
  <path d="M0 245 C 150 215, 250 300, 400 258 S 700 205, 800 248 L 800 288 C 700 246, 550 300, 400 296 S 150 250, 0 288 Z" fill="#b9d4e8"/>
  <!-- route -->
  <path d="M110 385 L 240 255 L 400 300 L 520 175 L 690 115" fill="none" stroke="#ffbe2e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- waypoints -->
  <circle cx="110" cy="385" r="11" fill="#005ea2" stroke="#fff" stroke-width="3"/>
  <circle cx="400" cy="300" r="9" fill="#005ea2" stroke="#fff" stroke-width="3"/>
  <!-- destination pin -->
  <path d="M690 108 c -19 0 -32 15 -32 32 c 0 23 32 49 32 49 c 0 0 32 -26 32 -49 c 0 -17 -13 -32 -32 -32 z" fill="#d83933" stroke="#fff" stroke-width="3"/>
  <circle cx="690" cy="140" r="10" fill="#fff"/>
</svg>
